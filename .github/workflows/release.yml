name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.1'
        required: true
        default: 'v0.1.1'

permissions:
  contents: write

env:
  NODE_VERSION: '20.19.0'
  RELEASE_REPO: yangbuyiya/desktop-pet
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Prepare release notes
        run: |
          node <<'NODE'
          const fs = require('fs');
          const yaml = fs.readFileSync('electron-builder.yml', 'utf8').split(/\r?\n/);
          const start = yaml.findIndex((line) => line.trim() === 'releaseNotes: |');
          if (start < 0) {
            fs.writeFileSync('release-notes.md', `发布 ${process.env.TAG_NAME} 版本。\n`);
            process.exit(0);
          }

          const notes = [];
          for (const line of yaml.slice(start + 1)) {
            if (/^\S/.test(line)) break;
            if (line.startsWith('    ')) {
              notes.push(line.slice(4));
            } else if (line.trim() === '') {
              notes.push('');
            } else {
              break;
            }
          }

          const body = notes.join('\n').trim() || `发布 ${process.env.TAG_NAME} 版本。`;
          fs.writeFileSync('release-notes.md', `${body}\n`);
          NODE

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG_NAME" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --repo "$RELEASE_REPO" \
              --title "$TAG_NAME" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$TAG_NAME" \
              --repo "$RELEASE_REPO" \
              --verify-tag \
              --title "$TAG_NAME" \
              --notes-file release-notes.md \
              --latest
          fi

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          npm config set registry https://registry.npmjs.org/
          npm ci --include=optional --registry=https://registry.npmjs.org/

      - name: Test
        run: npm test

      - name: Build Windows package
        run: npx electron-builder --win --publish never

      - name: Upload Windows release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(
            (Get-ChildItem dist -Filter '*.exe' | Select-Object -ExpandProperty FullName)
            (Get-ChildItem dist -Filter '*.exe.blockmap' | Select-Object -ExpandProperty FullName)
            (Resolve-Path dist/latest.yml).Path
          )
          gh release upload $env:TAG_NAME $assets --repo $env:RELEASE_REPO --clobber

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          npm config set registry https://registry.npmjs.org/
          npm ci --include=optional --registry=https://registry.npmjs.org/

      - name: Test
        run: npm test

      - name: Ensure DMG optional dependency
        run: |
          if ! node -e "require.resolve('dmg-license')"; then
            npm install dmg-license@1.0.11 --no-save --include=optional --registry=https://registry.npmjs.org/
          fi

      - name: Build macOS universal package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --universal --publish never

      - name: Upload macOS release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f dist/latest-mac.yml ]; then
            echo "Missing dist/latest-mac.yml"
            exit 1
          fi

          assets=()
          for pattern in "dist/*.dmg" "dist/*.dmg.blockmap" "dist/*.zip" "dist/*.zip.blockmap" "dist/latest-mac.yml"; do
            for asset in $pattern; do
              if [ -f "$asset" ]; then
                assets+=("$asset")
              fi
            done
          done

          if [ "${#assets[@]}" -lt 3 ]; then
            echo "Not enough macOS assets generated."
            printf '%s\n' "${assets[@]}"
            exit 1
          fi

          gh release upload "$TAG_NAME" "${assets[@]}" --repo "$RELEASE_REPO" --clobber
