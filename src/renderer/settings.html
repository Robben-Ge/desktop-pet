<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Pets 设置</title>
    <link rel="icon" type="image/png" href="../assets/logo.png" />
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand-lockup">
          <img src="../assets/logo.png" alt="" aria-hidden="true" />
          <div>
            <h1>Our Pets 设置</h1>
            <p id="apiInfo">切换角色、调整大小</p>
          </div>
        </div>
        <button id="refreshBtn" class="icon-command" type="button">刷新</button>
      </header>

      <div class="settings-layout">
        <aside class="control-rail">
          <section class="panel tuning-panel">
            <div class="panel-heading">
              <span class="eyebrow">外观</span>
              <h2>尺寸</h2>
            </div>
            <div class="control-row">
              <span>宠物</span>
              <strong id="zoomInfo">100%</strong>
            </div>
            <div class="segmented compact">
              <button type="button" data-zoom="0.75">75</button>
              <button type="button" data-zoom="1">100</button>
              <button type="button" data-zoom="1.25">125</button>
              <button type="button" data-zoom="1.5">150</button>
            </div>
            <div class="control-row">
              <span>气泡</span>
              <strong id="bubbleInfo">100%</strong>
            </div>
            <div class="segmented compact">
              <button type="button" data-bubble-scale="0.85">85</button>
              <button type="button" data-bubble-scale="1">100</button>
              <button type="button" data-bubble-scale="1.2">120</button>
              <button type="button" data-bubble-scale="1.4">140</button>
            </div>
          </section>

          <section class="panel storage-panel">
            <div class="panel-heading">
              <span class="eyebrow">高级</span>
              <h2>自定义宠物</h2>
              <p>把宠物文件夹放到自定义目录后，点重新加载即可。</p>
            </div>
            <div class="storage-actions">
              <button type="button" class="storage-action primary" id="chooseCustomBtn">选择文件夹</button>
              <button type="button" class="storage-action" data-open-folder="custom">打开文件夹</button>
            </div>
            <code id="customPetsRoot"></code>
          </section>
        </aside>

        <section class="content-stack">
          <section class="panel hero-panel">
            <div class="hero-copy">
              <span class="eyebrow">角色</span>
              <h2>内置宠物</h2>
              <p>安装后即可使用。托盘菜单也可以快速切换角色。</p>
              <div class="pet-library-controls">
                <div id="petSourceTabs" class="pet-source-tabs" role="tablist" aria-label="宠物来源">
                  <button type="button" data-pet-source="builtin" role="tab" aria-selected="true">内置</button>
                  <button type="button" data-pet-source="pets" role="tab" aria-selected="false">自定义</button>
                </div>
                <button id="reloadPetsBtn" class="reload-pets-button" type="button">重新加载</button>
              </div>
            </div>
            <div class="hero-count">
              <strong id="petCount">0</strong>
              <span id="petCountLabel">只宠物</span>
            </div>
          </section>

          <section class="panel pet-library-panel">
            <div id="petList" class="pet-list"></div>
          </section>

          <section class="panel">
            <div class="panel-title-row">
              <div>
                <span class="eyebrow">调试</span>
                <h2>动作测试</h2>
              </div>
              <span class="summary-pill">V2 · 9 行动画</span>
            </div>
            <div id="actionGrid" class="action-grid"></div>
          </section>

          <section class="panel update-panel" id="updatePanel">
            <div class="panel-title-row">
              <div>
                <span class="eyebrow">版本</span>
                <h2>应用更新</h2>
              </div>
              <span id="appVersion" class="summary-pill">v0.0.0</span>
            </div>
            <div class="update-status-row">
              <span id="updateLamp" class="update-lamp" aria-hidden="true"></span>
              <div class="update-copy">
                <strong id="updateState">尚未检查</strong>
                <span id="updateMessage">等待检查更新</span>
              </div>
            </div>
            <div class="update-progress" aria-hidden="true">
              <span id="updateProgressBar"></span>
            </div>
            <div class="update-actions">
              <button id="checkUpdateBtn" type="button" class="primary">检查更新</button>
              <button id="installUpdateBtn" type="button" hidden>重启安装</button>
              <button id="openReleasesBtn" type="button">打开 Releases</button>
            </div>
          </section>

          <section class="panel launch-panel">
            <div class="panel-title-row">
              <div>
                <span class="eyebrow">运行</span>
                <h2>启动与问候</h2>
              </div>
            </div>
            <div class="launch-global">
              <label class="toggle-row">
                <span class="toggle-label">开机自启动</span>
                <input type="checkbox" id="autoStartToggle" />
              </label>
              <label class="toggle-row">
                <span class="toggle-label">每日问候</span>
                <input type="checkbox" id="greetingEnabledToggle" />
              </label>
              <button type="button" id="greetingSayNowBtn" class="primary greeting-say-now">立即说一句</button>
              <div id="greetingTaskList" class="greeting-task-list"></div>
            </div>
          </section>

          <section class="panel reminder-panel">
            <div class="panel-title-row">
              <div>
                <span class="eyebrow">健康</span>
                <h2>⏰ 提醒</h2>
              </div>
              <div style="display:flex;align-items:center;gap:10px;">
                <span id="reminderSummary" class="summary-pill">已启用</span>
                <button type="button" id="reminderCollapseBtn" class="reminder-collapse-btn" title="折叠/展开">▼</button>
              </div>
            </div>

            <div class="reminder-global">
              <label class="toggle-row">
                <span class="toggle-label">总开关</span>
                <input type="checkbox" id="reminderMasterToggle" />
              </label>
              <label class="toggle-row">
                <span class="toggle-label">免打扰模式</span>
                <input type="checkbox" id="reminderQuietToggle" />
              </label>
              <div class="reminder-workhours">
                <span class="toggle-label">工作时段</span>
                <div class="time-range">
                  <input type="time" id="reminderWorkStart" value="09:00" />
                  <span>—</span>
                  <input type="time" id="reminderWorkEnd" value="18:00" />
                </div>
              </div>
            </div>

            <div id="reminderTypeList" class="reminder-type-list"></div>
          </section>
        </section>
      </div>
    </main>
    <div id="customModal" class="custom-modal" style="display:none;">
      <div class="custom-modal-box">
        <p id="customModalText"></p>
        <input type="text" id="customModalInput" style="display:none;" />
        <div class="custom-modal-actions">
          <button id="customModalCancel" type="button">取消</button>
          <button id="customModalOk" type="button" class="primary">确定</button>
        </div>
      </div>
    </div>
    <script src="./settings.js"></script>
  </body>
</html>
