appId: com.robbenge.our-pets
productName: Our Pets
copyright: Copyright © 2026 Robben-Ge
icon: src/assets/logo.png

directories:
  output: dist

files:
  - src/**
  - package.json
  - LICENSE
  - README.md
  - README.zh-CN.md
  - '!**/.DS_Store'
  - '!**/*.map'
  - '!**/test/**'
  - '!**/.github/**'
  - '!scripts/**'

asar: true

win:
  executableName: OurPets
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Our Pets
  uninstallDisplayName: Our Pets
  artifactName: Our-Pets-${version}-${platform}-${arch}.${ext}

mac:
  category: public.app-category.utilities
  extendInfo:
    LSUIElement: true
  target:
    - zip
  artifactName: Our-Pets-${version}-${platform}-${arch}.${ext}
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false

npmRebuild: false

publish:
  provider: github
  owner: Robben-Ge
  repo: desktop-pet

releaseInfo:
  releaseNotes: |
    ## Our Pets 发布版本

    - 发布 Windows x64 安装包
    - 发布 macOS zip 安装包
    - 从 GitHub Releases 读取自动更新
